# The URL the site will be built for
base_url = "https://monikajassova.github.io"

title = "Monikin ITinerár"
description = "Moje zápisky z cesty po svete IT"

default_language = "sk"

# Whether to automatically compile all Sass files in the sass directory
compile_sass = false

minify_html = true

# Whether to build a search index to be used later on by a JavaScript library.
# Uses the `fuse` backend (index_format = "fuse_json") because the elasticlunr
# backend does not support Slovak. fuse is language-agnostic, so both the
# Slovak (default) and English indexes are built.
build_search_index = true

theme = "apollo"

taxonomies = [{ name = "tags" }]

generate_feeds = true

feed_filenames = ["atom.xml", "rss.xml"]

author = "Monika Jaššová"

[languages.en]
title = "Monika's ITinerary"
generate_feeds = true
build_search_index = true
feed_filenames = ["atom.xml", "rss.xml"]
taxonomies = [{ name = "tags" }]
search = { include_title = true, include_description = true, include_path = true, include_content = true, index_format = "fuse_json" }

